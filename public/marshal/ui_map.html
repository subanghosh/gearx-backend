<body class="bg-background text-on-surface font-body-md overflow-hidden h-screen flex flex-col">
<!-- Top App Bar (Shared Component Anchor) -->
<header class="fixed top-0 left-0 w-full z-40 flex justify-between items-center w-full px-margin-mobile h-16 bg-surface/80 backdrop-blur-md border-b border-white/10">
<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full bg-primary-container flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<h1 class="text-headline-md font-headline-md font-extrabold text-on-surface">ReDrivo Marshal</h1>
</div>
<div class="flex items-center gap-xs px-sm py-xs bg-primary-container/10 border border-primary-container/20 rounded-full">
<div class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></div>
<span class="text-label-md font-label-md text-primary-container">ONLINE</span>
</div>
</header>
<!-- Main Navigation/Map Canvas -->
<main class="relative flex-1 w-full overflow-hidden">
<!-- Map Background -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover grayscale opacity-60" data-alt="A cinematic top-down view of a dark-themed digital city map at night. The map features high-contrast glowing neon yellow navigation lines tracing a path through a grid of sleek, charcoal-black urban blocks. Subtle light flares and digital artifacts enhance the tech-forward, professional marshal app aesthetic. The color palette is strictly dominated by deep blacks, slate grays, and vibrant kinetic yellow accents." data-location="Noida, India" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDpkT1SV-fK_mtn1nnH4Z_9SkhoL4tSAZYEgJJHdYzS4f8Xi-nNEYrcFXZAb8_1VklvvUjQIkGlWbT8quv0YUXBmXlm_YL58C04JmWm5STTY6rmGG57JiEqTVeEDxP6ZVamswsW6VVL9229VJK788hBhSkcjhPSNOotaihauGy1YK_4PoS7gO9EfTuR3hqhlhi5M9s5W7eSkSfsaQ9fHhvOhobnG6UEeXmolDT14WZUZKOt2g9Sz79Y4Ny5GsgRYEgaJfseDulwWPE"/>
<div class="absolute inset-0 map-gradient-overlay pointer-events-none"></div>
</div>
<!-- Map Navigation HUD Overlay -->
<div class="absolute top-20 right-margin-mobile z-20 flex flex-col gap-sm items-end">
<!-- Floating Navigate Button -->
<button class="flex items-center gap-xs px-md py-sm bg-primary-container text-on-primary rounded-xl shadow-xl active:scale-95 transition-all duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">directions</span>
<span class="font-label-md text-label-md">Navigate</span>
</button>
<!-- Route Info Bubble (Floating) -->
<div class="glass-panel p-sm rounded-xl border border-white/10 flex flex-col items-end">
<span class="text-label-sm font-label-sm text-on-surface-variant uppercase tracking-widest">Target</span>
<span class="text-headline-md font-headline-md text-primary-container">Sector 62, Noida</span>
</div>
</div>
<!-- Center Marker (Visual Anchor) -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="relative">
<div class="absolute -inset-4 bg-primary-container/20 rounded-full animate-ping"></div>
<div class="relative w-6 h-6 bg-primary-container rounded-full border-4 border-background flex items-center justify-center shadow-lg">
<div class="w-2 h-2 bg-on-primary rounded-full"></div>
</div>
</div>
</div>
</main>
<!-- Persistent Bottom Sheet -->
<section class="fixed bottom-0 left-0 w-full z-50 transition-transform duration-500 transform translate-y-0 h-[32%]">
<div class="h-full bg-surface-container border-t border-white/10 rounded-t-[2rem] shadow-[0_-10px_40px_rgba(0,0,0,0.5)] flex flex-col">
<!-- Handle -->
<div class="w-full flex justify-center pt-sm pb-xs">
<div class="w-12 h-1 bg-white/20 rounded-full"></div>
</div>
<!-- Content Area -->
<div class="flex-1 px-margin-mobile py-sm flex flex-col justify-between">
<!-- Top Row: Trip Info -->
<div class="flex justify-between items-start">
<div class="flex flex-col">
<span class="text-headline-md font-headline-md text-on-surface">Rahul M.</span>
<div class="flex items-center gap-xs mt-xs">
<span class="material-symbols-outlined text-[18px] text-on-surface-variant">directions_car</span>
<span class="text-body-md font-body-md text-on-surface-variant">Honda City • UP16 BY 1234</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="text-display-lg font-display-lg text-primary-container leading-none">2.5<span class="text-headline-md ml-xs">km</span></span>
<span class="text-label-md font-label-md text-primary-container/70 mt-xs">8 mins ETA</span>
</div>
</div>
<!-- Middle Row: Status Badge -->
<div class="mt-sm">
<div class="inline-flex items-center px-sm py-xs bg-white/5 border border-white/10 rounded-lg">
<span class="material-symbols-outlined text-[16px] text-primary-container mr-xs" style="font-variation-settings: 'FILL' 1;">location_on</span>
<span class="text-label-sm font-label-sm text-on-surface-variant">Pickup: Great India Place Mall</span>
</div>
</div>
<!-- Bottom Row: Action Buttons -->
<div class="flex gap-sm items-center mt-md mb-base">
<!-- Call Button (Secondary) -->
<button class="w-14 h-14 flex items-center justify-center rounded-xl border-2 border-primary-container text-primary-container hover:bg-primary-container/10 active:scale-90 transition-all duration-150">
<span class="material-symbols-outlined text-[24px]">call</span>
</button>
<!-- Arrived Button (Primary) -->
<button class="flex-1 h-14 bg-primary-container text-on-primary font-label-md text-label-md rounded-xl shadow-lg shadow-primary-container/20 flex items-center justify-center gap-sm active:scale-95 transition-all duration-150">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                        Arrived at Pickup
                    </button>
</div>
</div>
</div>
</section>
<!-- Bottom Nav Bar (Shared Component Anchor) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 bg-surface-container border-t border-white/10 shadow-lg hidden md:hidden">
<!-- Tasks is active for this screen -->
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="local_shipping">local_shipping</span>
<span class="text-label-sm font-label-sm">Fleet</span>
</div>
<div class="flex flex-col items-center justify-center text-primary-container font-bold">
<span class="material-symbols-outlined" data-icon="assignment" style="font-variation-settings: 'FILL' 1;">assignment</span>
<span class="text-label-sm font-label-sm">Tasks</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
<span class="text-label-sm font-label-sm">Alerts</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
<span class="text-label-sm font-label-sm">Profile</span>
</div>
</nav>
<script>
        // Micro-interaction for the bottom sheet "pulse"
        document.addEventListener('DOMContentLoaded', () => {
            const arrivedBtn = document.querySelector('button:last-of-type');
            arrivedBtn.addEventListener('click', () => {
                arrivedBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Processing...';
                setTimeout(() => {
                    arrivedBtn.classList.remove('bg-primary-container');
                    arrivedBtn.classList.add('bg-green-500', 'text-white');
                    arrivedBtn.innerHTML = '<span class="material-symbols-outlined">check</span> Arrived Successfully';
                }, 1200);
            });
        });
    </script>
</body></html>
